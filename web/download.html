<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Baixe o app MasterPalm - Gestão completa para sua loja">
  <title>Baixar MasterPalm - App para Android</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      color: #eee;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: rgba(255,255,255,0.05);
      border-radius: 16px;
      padding: 40px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      border: 1px solid rgba(255,161,0,0.2);
    }
    .logo { width: 80px; height: 80px; margin-bottom: 20px; border-radius: 16px; }
    h1 { font-size: 1.75rem; margin-bottom: 8px; color: #fff; }
    .subtitle { color: #aaa; margin-bottom: 28px; font-size: 0.95rem; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #ffa100;
      color: #000;
      text-decoration: none;
      padding: 16px 28px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 1.1rem;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255,161,0,0.4);
    }
    .btn svg { width: 24px; height: 24px; }
    .versao { color: #888; font-size: 0.85rem; margin-top: 20px; }
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="icons/Icon-192.png" alt="MasterPalm" onerror="this.style.display='none'">
    <h1>MasterPalm</h1>
    <p class="subtitle">Gestão completa para sua loja: vendas, clientes, estoque, catálogo, pedidos e pagamentos.</p>
    <a href="downloads/masterpalm.apk" class="btn" download="masterpalm.apk">
      <svg fill="currentColor" viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
      Baixar para Android
    </a>
    <p class="versao">Versão 1.0.0</p>
    <p style="margin-top: 28px; font-size: 0.95rem;">
      <a href="/modelos-importacao.html" style="color: #7dd3fc;">Modelos de planilha para importação no app</a>
    </p>
  </div>
</body>
</html>
