  <!-- ?diag=1&cacheReset=1 : limpa SW, Cache API e chaves de diagnóstico antes do Flutter; redireciona com cacheResetDone=1 -->
  <script>
    (function () {
      function shouldRun() {
        try {
          var u = new URL(location.href);
          return u.searchParams.get('diag') === '1' && u.searchParams.get('cacheReset') === '1';
        } catch (e) {
          return false;
        }
      }
      if (!shouldRun()) return;
      var keys = [
        'mp_last_runtime_error',
        'mp_catalog_resolver_result',
        'mp_fetch_log',
        'mp_diag_sw_state',
        'mp_catalog_phase',
        'mp_catalog_build_id'
      ];
      try {
        for (var i = 0; i < keys.length; i++) {
          try { localStorage.removeItem(keys[i]); } catch (e) {}
        }
      } catch (e) {}
      var next;
      try {
        var u = new URL(location.href);
        u.searchParams.delete('cacheReset');
        u.searchParams.set('cacheResetDone', '1');
        next = u.toString();
      } catch (e) {
        next = location.href;
      }
      var p1 = ('serviceWorker' in navigator)
        ? navigator.serviceWorker.getRegistrations().then(function (regs) {
            return Promise.all(regs.map(function (r) { return r.unregister(); }));
          })
        : Promise.resolve();
      var p2 = (window.caches && caches.keys)
        ? caches.keys().then(function (ks) {
            return Promise.all(ks.map(function (k) { return caches.delete(k); }));
          })
        : Promise.resolve();
      Promise.all([p1, p2]).finally(function () {
        try { location.replace(next); } catch (e) { location.href = next; }
      });
    })();
  </script>

  <!-- Build com --pwa-strategy=none: não registar SW. Limpeza única por buildId evita shell/cache legado sem reload infinito. -->
  <script>
    (function () {
      function isDiagMode() {
        try {
          var u = new URL(location.href);
          return u.searchParams.get('diag') === '1' || u.searchParams.get('netTest') === '1';
        } catch (_) {
          return false;
        }
      }
      function sanitizeUrl(raw) {
        try {
          var u = new URL(String(raw), location.origin);
          var blocked = {
            token: true,
            auth: true,
            authorization: true,
            key: true,
            apikey: true,
            appcheck: true,
            app_check: true,
            recaptcha: true,
            id_token: true,
            access_token: true,
            refresh_token: true,
            code: true,
            secret: true
          };
          var keep = [];
          u.searchParams.forEach(function (value, key) {
            if (!blocked[String(key).toLowerCase()]) keep.push([key, value]);
          });
          u.search = '';
          for (var i = 0; i < keep.length; i++) {
            u.searchParams.append(keep[i][0], keep[i][1]);
          }
          return u.origin + u.pathname + (u.search ? u.search : '');
        } catch (_) {
          return String(raw || '').slice(0, 280);
        }
      }
      function pushFetchLog(entry) {
        if (!isDiagMode()) return;
        try {
          var key = 'mp_fetch_log';
          var raw = localStorage.getItem(key);
          var arr = [];
          if (raw) {
            try {
              var parsed = JSON.parse(raw);
              if (Array.isArray(parsed)) arr = parsed;
            } catch (_) {}
          }
          arr.push(entry);
          if (arr.length > 80) arr = arr.slice(arr.length - 80);
          localStorage.setItem(key, JSON.stringify(arr));
        } catch (_) {}
      }
      function updateSwDiagState() {
        if (!isDiagMode()) return;
        try {
          var payload = {
            ts: new Date().toISOString(),
            controller: !!(navigator.serviceWorker && navigator.serviceWorker.controller),
            iosswfixRan: location.search.indexOf('iosswfix=1') >= 0,
            userAgent: navigator.userAgent || ''
          };
          var p = Promise.resolve();
          if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
            p = p.then(function () {
              return navigator.serviceWorker.getRegistrations().then(function (regs) {
                payload.registrations = regs.map(function (r) {
                  return {
                    scope: r.scope || '',
                    active: !!r.active,
                    waiting: !!r.waiting,
                    installing: !!r.installing
                  };
                });
              });
            });
          }
          if (window.caches && caches.keys) {
            p = p.then(function () {
              return caches.keys().then(function (keys) {
                payload.caches = keys || [];
              });
            });
          }
          p.finally(function () {
            localStorage.setItem('mp_diag_sw_state', JSON.stringify(payload));
          });
        } catch (_) {}
      }
      if (isDiagMode() && window.fetch && !window.__mpFetchDiagWrapped) {
        window.__mpFetchDiagWrapped = true;
        var originalFetch = window.fetch.bind(window);
        window.fetch = function (input, init) {
          var method = (init && init.method) ? String(init.method).toUpperCase() : 'GET';
          var url = '';
          try {
            url = typeof input === 'string' ? input : (input && input.url ? input.url : '');
          } catch (_) {}
          var safeUrl = sanitizeUrl(url);
          var startedAt = Date.now();
          return originalFetch(input, init).then(function (resp) {
            pushFetchLog({
              ts: new Date().toISOString(),
              method: method,
              url: safeUrl,
              status: resp && typeof resp.status === 'number' ? resp.status : null,
              ok: !!(resp && resp.ok),
              elapsedMs: Date.now() - startedAt
            });
            return resp;
          }).catch(function (err) {
            pushFetchLog({
              ts: new Date().toISOString(),
              method: method,
              url: safeUrl,
              status: null,
              ok: false,
              errorName: err && err.name ? String(err.name) : '',
              errorMessage: err && err.message ? String(err.message) : String(err),
              elapsedMs: Date.now() - startedAt
            });
            throw err;
          });
        };
      }
      updateSwDiagState();
      function getSlugFromLocation() {
        try {
          var p = location.pathname || '';
          var parts = p.split('/').filter(Boolean);
          if (parts.length >= 2 && parts[0] === 'loja') return parts[1] || '';
          var u = new URL(location.href);
          return (u.searchParams.get('loja') || u.searchParams.get('slug') || u.searchParams.get('store_id') || '').trim();
        } catch (_) {
          return '';
        }
      }
      function saveRuntimeError(payload) {
        try {
          localStorage.setItem('mp_last_runtime_error', JSON.stringify(payload));
        } catch (_) {}
      }
      window.addEventListener('error', function (ev) {
        try {
          var msg = (ev && ev.message) ? String(ev.message) : 'window.onerror';
          var errObj = ev && ev.error;
          var stack = '';
          try {
            stack = errObj && errObj.stack ? String(errObj.stack) : '';
          } catch (_) {}
          var payload = {
            buildId: localStorage.getItem('mp_catalog_build_id') || 'unknown',
            timestamp: new Date().toISOString(),
            host: location.host || '',
            path: location.pathname || '',
            query: (location.search || '').replace(/^\?/, ''),
            userAgent: navigator.userAgent || '',
            fase: 'window.onerror',
            slug: getSlugFromLocation(),
            lojaId: '',
            error: msg,
            stack: stack,
            source: (ev && ev.filename) ? String(ev.filename) : '',
            lineno: (ev && typeof ev.lineno === 'number') ? ev.lineno : 0,
            colno: (ev && typeof ev.colno === 'number') ? ev.colno : 0
          };
          saveRuntimeError(payload);
        } catch (_) {}
      });
      window.addEventListener('unhandledrejection', function (ev) {
        try {
          var reason = ev && ev.reason ? ev.reason : 'unhandledrejection';
          var msg = '';
          var stack = '';
          var reasonName = '';
          var reasonCode = '';
          var reasonMessage = '';
          var reasonJson = '';
          var reasonKeys = '';
          if (reason && typeof reason === 'object') {
            msg = reason.toString ? String(reason.toString()) : '[object]';
            stack = reason.stack ? String(reason.stack) : '';
            reasonName = reason.name ? String(reason.name) : '';
            reasonCode = reason.code ? String(reason.code) : '';
            reasonMessage = reason.message ? String(reason.message) : '';
            try {
              reasonJson = JSON.stringify(reason) || '';
            } catch (_) {
              reasonJson = '';
            }
            try {
              reasonKeys = Object.keys(reason).join(',');
            } catch (_) {
              reasonKeys = '';
            }
          } else {
            msg = String(reason);
          }
          var payload = {
            buildId: localStorage.getItem('mp_catalog_build_id') || 'unknown',
            timestamp: new Date().toISOString(),
            host: location.host || '',
            path: location.pathname || '',
            query: (location.search || '').replace(/^\?/, ''),
            userAgent: navigator.userAgent || '',
            fase: 'window.unhandledrejection',
            slug: getSlugFromLocation(),
            lojaId: '',
            error: msg,
            stack: stack,
            reasonName: reasonName,
            reasonMessage: reasonMessage,
            reasonCode: reasonCode,
            reasonJson: reasonJson,
            reasonKeys: reasonKeys,
            source: '',
            lineno: 0,
            colno: 0
          };
          saveRuntimeError(payload);
        } catch (_) {}
      });
    })();
  </script>
  <!-- iPhone WebKit (Safari/Chrome/WhatsApp): limpeza única de SW/cache para evitar mix de bundles -->
  <script>
    (function () {
      if (location.search.indexOf('cacheReset=1') >= 0) return;
      var ua = (navigator.userAgent || '').toLowerCase();
      var isIosWebKit =
        (ua.indexOf('iphone') >= 0 || ua.indexOf('ipad') >= 0 || ua.indexOf('ipod') >= 0) &&
        ua.indexOf('applewebkit') >= 0;
      if (!isIosWebKit) return;
      if (!('serviceWorker' in navigator)) return;
      if (location.search.indexOf('iosswfix=1') >= 0) return;
      Promise.all([
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          return Promise.all(regs.map(function (r) { return r.unregister(); }));
        }),
        (window.caches && caches.keys)
          ? caches.keys().then(function (keys) {
              return Promise.all(keys.map(function (k) { return caches.delete(k); }));
            })
          : Promise.resolve()
      ]).finally(function () {
        var sep = location.search ? '&' : '?';
        location.replace(location.pathname + location.search + sep + 'iosswfix=1' + location.hash);
      });
    })();
  </script>

  <!--
    Google Sign-In na Web: client_id é passado via código (Dart).
    Evita meta google-signin-client_id: pode acionar inicialização legada e redirecionar
    para Google antes da tela de login.
  -->
  <style>
    #initial-loader{position:fixed;inset:0;z-index:99999;background:#f0f2f5;display:flex;align-items:center;justify-content:center;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;}
    #initial-loader .loader-card{text-align:center;padding:24px;max-width:360px;}
    #initial-loader .loader-logo{display:inline-block;background:#9a4e6b;color:#fff;padding:12px 20px;border-radius:12px;font-weight:700;font-size:1.25rem;margin-bottom:28px;letter-spacing:.03em;}
    #initial-loader .loader-text{font-size:1.15rem;font-weight:600;color:#111;margin-bottom:8px;}
    #initial-loader .loader-sub{font-size:.95rem;color:#666;line-height:1.45;margin-bottom:24px;}
    #initial-loader .loader-spin{width:36px;height:36px;border:3px solid #ddd;border-top-color:#9a4e6b;border-radius:50%;margin:0 auto;animation:initial-loader-spin .7s linear infinite;}
    @keyframes initial-loader-spin{to{transform:rotate(360deg)}}
  </style>

  <div id="initial-loader" aria-live="polite">
    <div class="loader-card">

      <div class="loader-text">Carregando catálogo...</div>
      <div class="loader-sub">Estamos preparando a loja para você.</div>
      <div class="loader-spin" aria-hidden="true"></div>
    </div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('initial-loader');
      if (el) el.remove();
    });
  </script>

  <!-- Flutter bootstrap: após limpeza opcional de SW/Cache Storage por buildId (só produção). -->
  <script>
    (function () {
      function injectFlutterBootstrap() {
        var s = document.createElement('script');
        s.src = 'flutter_bootstrap.js';
        s.async = false;
        (document.body || document.head).appendChild(s);
      }
      var h = location.hostname || '';
      if (h === 'localhost' || h === '127.0.0.1' || h === '[::1]') {
        injectFlutterBootstrap();
        return;
      }
      var LS = 'mp_web_sw_cleanup_done_for';
      var vUrl = '/version.json';
      try {
        vUrl = new URL('version.json', location.origin + '/').toString();
      } catch (e) {}
      fetch(vUrl + (vUrl.indexOf('?') >= 0 ? '&' : '?') + 'cb=' + Date.now(), {
        cache: 'no-store',
        credentials: 'same-origin'
      })
        .then(function (r) { return r.ok ? r.json() : Promise.reject(); })
        .then(function (j) {
          var bid = String((j && j.buildId) || '').trim();
          var last = '';
          try { last = localStorage.getItem(LS) || ''; } catch (e) {}
          if (!bid || bid === last) return;
          if (!('serviceWorker' in navigator)) {
            try { localStorage.setItem(LS, bid); } catch (e) {}
            return;
          }
          return navigator.serviceWorker.getRegistrations().then(function (regs) {
            return Promise.all(regs.map(function (x) { return x.unregister(); }));
          }).then(function () {
            if (!window.caches || !caches.keys) return;
            return caches.keys().then(function (keys) {
              return Promise.all(keys.filter(function (k) {
                return String(k).toLowerCase().indexOf('flutter') >= 0;
              }).map(function (k) { return caches.delete(k); }));
            });
          }).then(function () {
            try { localStorage.setItem(LS, bid); } catch (e) {}
          });
        })
        .catch(function () {})
        .finally(function () { injectFlutterBootstrap(); });
    })();
  </script>
</body>
