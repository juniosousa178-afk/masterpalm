name: master_palm
description: "MasterPalm - Gestão completa para sua loja: vendas, clientes, estoque, catálogo, pedidos e pagamentos. Multi-loja, relatórios e campanhas de sorteio."
publish_to: 'none'

version: 1.0.47+63

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  # Estado local / utilitários
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.2
  shared_preferences: ^2.2.2
  device_info_plus: ^11.2.0  # 11.5+ exige SDK >=3.7; 11.2 compatível com Dart 3.5
  intl: any  # Flutter i18n: versão resolvida pelo SDK via flutter_localizations
  collection: ^1.18.0
  diacritic: ^0.1.3
  vector_math: ^2.1.4

  # UI / mídia
  image_picker: ^1.1.2
  video_player: ^2.9.2
  flutter_colorpicker: ^1.0.3
  cupertino_icons: ^1.0.8
  fl_chart: ^0.66.2  # fixa para evitar erro do Matrix4

  # Arquivos / share / etc
  excel: ^4.0.1
  file_picker: ^10.1.9
  open_filex: ^4.3.2
  flutter_file_dialog: ^3.0.2
  share_plus: ^11.0.0
  permission_handler: ^12.0.0+1
  archive: ^3.3.1
  logger: ^2.0.2
  http: ^1.5.0
  url_launcher: ^6.3.0
  qr_flutter: ^4.0.0
  mobile_scanner: ^6.0.2
  contacts_service_plus: ^0.0.2
  printing: ^5.12.0
  pdf: ^3.10.7
  flutter_local_notifications: ^17.1.2
  android_intent_plus: ^5.3.0
  font_awesome_flutter: ^10.4.0
  crypto: ^3.0.3
  uuid: ^4.5.1
  csv: ^6.0.0
  read_pdf_text: ^0.3.1
  google_fonts: ^6.2.1
  pool: ^1.5.1
  provider: ^6.1.2
  timezone: ^0.9.2
  flutter_fortune_wheel: ^1.3.0

  # Deep links
  app_links: ^6.4.1

  # Firebase (linhas compatíveis entre si)
  firebase_core: ^3.15.2
  firebase_auth: ^5.6.2
  google_sign_in: ^6.2.2
  google_sign_in_web: ^0.12.0  # renderButton (GIS) - evita COOP/popup
  cloud_firestore: ^5.6.12
  cloud_functions: ^5.0.0
  firebase_storage: ^12.4.9
  firebase_messaging: ^15.1.5
  connectivity_plus: ^6.1.4
  mailer: ^6.5.0
  firebase_dynamic_links: ^6.1.10

  # App Check (compatível com os pacotes acima)
  firebase_app_check: ^0.3.2+10

  # Remote Config (chaves sensíveis) - compatível com firebase_core 3.x
  firebase_remote_config: ^5.5.0

  # Monitoramento (Crashlytics + Analytics) - versões compatíveis com firebase_core 3.x
  firebase_crashlytics: ^4.3.10
  firebase_analytics: ^11.3.3

  path: ^1.9.0
  package_info_plus: ^8.0.0
  image: ^4.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  build_runner: ^2.4.13
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.14.3

dependency_overrides:
  collection: 1.19.1   # 1.18.0 falta CaseInsensitiveMap.fromEntries (shelf/build_runner)
  font_awesome_flutter: 10.4.0   # 10.5+ usa Color.withValues (Dart 3.7+)
  http_parser: 4.1.2   # 4.1+ necessario para shelf/build_runner (CaseInsensitiveMap.fromEntries)

flutter:
  uses-material-design: true
  assets:
    - assets/contrato_adesao.md
    - assets/images/logo_masterpalm.png
    - assets/images/
    - assets/images/placeholder.png
    - assets/payments/mastercard.png
    - assets/payments/visa.png
    - assets/payments/hipercard.png
    - assets/payments/amex.png
    - assets/payments/diners.png
    - assets/payments/elo.png
    - assets/payments/pix.png
    - assets/payments/boleto.png
    - assets/payments/transfer.png
    - assets/payments/barcode.png
    - assets/badges/ssl.png
    - assets/badges/google-safe-browsing.png
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true  # App Store não permite ícones com canal alpha
  image_path: assets/images/logo_masterpalm.png
  # Fundo preto para destaque da logo (Android adaptive icon)
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: assets/images/logo_masterpalm.png
  # Web: favicon (aba do navegador) e ícones PWA (Google, app instalado)
  web:
    generate: true
    image_path: assets/images/logo_masterpalm.png
    background_color: "#6366F1"
    theme_color: "#6366F1"